[project]
name = "Formula-1-Results"
version = "0.1.0"
description = "F1 season agent: chat about the latest results, standings, title math and next race, with tool calls shown in the UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "fastf1>=3.8.3",
]
